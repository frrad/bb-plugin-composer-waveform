name: Composer Git install
on:
  pull_request:
    paths:
      - 'plugins/composer/**'
      - 'fork/**'
      - '.github/workflows/composer-install.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/composer/**'
      - 'fork/**'
      - '.github/workflows/composer-install.yml'
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy outside the workspace
        run: cp -R plugins/composer "$RUNNER_TEMP/composer"
      - name: Install and build with production dependencies
        working-directory: ${{ runner.temp }}/composer
        run: |
          npm ci --omit=dev --omit=optional --ignore-scripts
          npx --yes --package=bb-app@0.48.0 bb plugin build .
      - name: Check types and tests
        working-directory: ${{ runner.temp }}/composer
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
